<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>循环倒计时/正计时器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .timer-circle {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 30px;
        }
        
        .circle-bg {
            fill: none;
            stroke: #eee;
            stroke-width: 10;
        }
        
        .circle-progress {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.3s, stroke 0.5s;
        }
        
        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #333;
            transition: color 0.5s;
        }
        
        .timer-display.over-time {
            color: #e74c3c;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .start-btn {
            background-color: #2ecc71;
            color: white;
        }
        
        .start-btn:hover {
            background-color: #27ae60;
        }
        
        .start-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        
        .pause-btn {
            background-color: #f39c12;
            color: white;
        }
        
        .pause-btn:hover {
            background-color: #d35400;
        }
        
        .complete-btn {
            background-color: #3498db;
            color: white;
        }
        
        .complete-btn:hover {
            background-color: #2980b9;
        }
        
        .status {
            font-size: 18px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            background-color: #f8f9fa;
            transition: background-color 0.3s;
        }
        
        .cycle-info {
            margin-top: 20px;
            font-size: 16px;
            color: #555;
        }
        
        .records-section {
            margin-top: 30px;
            text-align: left;
        }
        
        .records-section h2 {
            margin-bottom: 15px;
            color: #333;
            text-align: center;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #3498db;
            color: white;
            font-weight: bold;
        }
        
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        tr:hover {
            background-color: #f1f1f1;
        }
        
        .over-time-cell {
            color: #e74c3c;
            font-weight: bold;
        }
        
        .normal-time-cell {
            color: #2ecc71;
            font-weight: bold;
        }
        
        .auto-next-info {
            margin-top: 15px;
            padding: 10px;
            background-color: #e8f4fd;
            border-radius: 8px;
            color: #2980b9;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .timer-circle {
                width: 250px;
                height: 250px;
            }
            
            .timer-display {
                font-size: 40px;
            }
            
            button {
                padding: 10px 20px;
                font-size: 14px;
            }
            
            th, td {
                padding: 8px 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>循环倒计时/正计时器</h1>
        
        <div class="timer-circle">
            <svg width="100%" height="100%" viewBox="0 0 120 120">
                <circle class="circle-bg" cx="60" cy="60" r="54"></circle>
                <circle class="circle-progress" id="progress-circle" cx="60" cy="60" r="54"></circle>
            </svg>
            <div class="timer-display" id="timer">04:00</div>
        </div>
        
        <div class="controls">
            <button class="start-btn" id="start-btn">开始计时</button>
            <button class="pause-btn" id="pause-btn">暂停</button>
            <button class="complete-btn" id="complete-btn">完成本轮</button>
        </div>
        
        <div class="status" id="status">准备开始</div>
        
        <div class="auto-next-info" id="auto-next-info">
            完成本轮后将自动开始下一轮计时
        </div>
        
        <div class="cycle-info">
            <p>倒计时: 4分钟 | 正计时: 无限制</p>
            <p>倒计时阶段: 绿色 | 正计时阶段: 红色</p>
        </div>
        
        <div class="records-section">
            <h2>计时记录</h2>
            <table id="records-table">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>计时时间</th>
                        <th>是否超时</th>
                    </tr>
                </thead>
                <tbody id="records-body">
                    <!-- 记录将通过JavaScript动态添加 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 全局变量
        let timer;
        let isRunning = false;
        let isPaused = false;
        let isOverTime = false;
        let totalSeconds = 4 * 60; // 4分钟
        let elapsedSeconds = 0;
        let overTimeSeconds = 0;
        let recordCount = 0;
        let records = [];
        
        // DOM元素
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const completeBtn = document.getElementById('complete-btn');
        const statusDisplay = document.getElementById('status');
        const progressCircle = document.getElementById('progress-circle');
        const recordsBody = document.getElementById('records-body');
        const autoNextInfo = document.getElementById('auto-next-info');
        
        // 初始化进度条
        const radius = progressCircle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        progressCircle.style.strokeDashoffset = circumference;
        
        // 设置进度
        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }
        
        // 更新时间显示
        function updateDisplay() {
            let minutes, seconds;
            
            if (isOverTime) {
                minutes = Math.floor(overTimeSeconds / 60);
                seconds = overTimeSeconds % 60;
                timerDisplay.textContent = `+${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                timerDisplay.classList.add('over-time');
                progressCircle.style.stroke = '#e74c3c';
            } else {
                minutes = Math.floor((totalSeconds - elapsedSeconds) / 60);
                seconds = (totalSeconds - elapsedSeconds) % 60;
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                timerDisplay.classList.remove('over-time');
                progressCircle.style.stroke = '#2ecc71';
            }
            
            // 更新进度条
            if (!isOverTime) {
                const progressPercent = (elapsedSeconds / totalSeconds) * 100;
                setProgress(progressPercent);
            } else {
                setProgress(100);
            }
        }
        
        // 开始计时
        function startTimer() {
            if (isRunning && !isPaused) return;
            
            if (isPaused) {
                isPaused = false;
            } else {
                elapsedSeconds = 0;
                overTimeSeconds = 0;
                isOverTime = false;
            }
            
            isRunning = true;
            statusDisplay.textContent = '倒计时进行中...';
            statusDisplay.style.backgroundColor = '#e8f6f3';
            startBtn.disabled = true;
            
            timer = setInterval(() => {
                if (!isOverTime) {
                    elapsedSeconds++;
                    
                    if (elapsedSeconds >= totalSeconds) {
                        isOverTime = true;
                        statusDisplay.textContent = '已超时！请点击"完成本轮"或等待自动下一轮';
                        statusDisplay.style.backgroundColor = '#ffebee';
                    }
                } else {
                    overTimeSeconds++;
                }
                
                updateDisplay();
            }, 1000);
        }
        
        // 暂停计时
        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(timer);
            isPaused = true;
            isRunning = false;
            statusDisplay.textContent = '已暂停';
            statusDisplay.style.backgroundColor = '#fef9e7';
            startBtn.disabled = false;
        }
        
        // 完成本轮
        function completeCycle() {
            clearInterval(timer);
            
            // 添加记录
            if (isRunning || isPaused) {
                addRecord();
            }
            
            isRunning = false;
            isPaused = false;
            isOverTime = false;
            elapsedSeconds = 0;
            overTimeSeconds = 0;
            
            updateDisplay();
            statusDisplay.textContent = '准备开始新一轮';
            statusDisplay.style.backgroundColor = '#f8f9fa';
            startBtn.disabled = false;
            
            // 自动开始下一轮
            setTimeout(() => {
                if (!isRunning) {
                    startTimer();
                }
            }, 1000);
        }
        
        // 添加记录到表格
        function addRecord() {
            recordCount++;
            const totalTimeSeconds = isOverTime ? totalSeconds + overTimeSeconds : elapsedSeconds;
            const minutes = Math.floor(totalTimeSeconds / 60);
            const seconds = totalTimeSeconds % 60;
            const timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            const isOverTimeRecord = isOverTime;
            
            records.push({
                id: recordCount,
                time: timeString,
                isOverTime: isOverTimeRecord
            });
            
            // 更新表格
            updateRecordsTable();
        }
        
        // 更新记录表格
        function updateRecordsTable() {
            // 清空表格
            recordsBody.innerHTML = '';
            
            // 添加记录行
            records.forEach(record => {
                const row = document.createElement('tr');
                
                // 序号列
                const idCell = document.createElement('td');
                idCell.textContent = record.id;
                row.appendChild(idCell);
                
                // 时间列
                const timeCell = document.createElement('td');
                timeCell.textContent = record.time;
                row.appendChild(timeCell);
                
                // 是否超时列
                const overTimeCell = document.createElement('td');
                if (record.isOverTime) {
                    overTimeCell.textContent = '是';
                    overTimeCell.className = 'over-time-cell';
                } else {
                    overTimeCell.textContent = '否';
                    overTimeCell.className = 'normal-time-cell';
                }
                row.appendChild(overTimeCell);
                
                recordsBody.appendChild(row);
            });
        }
        
        // 事件监听
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        completeBtn.addEventListener('click', completeCycle);
        
        // 初始化显示
        updateDisplay();
    </script>
</body>
</html>
